################################################################################
# HelloFresh — example Lovelace dashboard
#
# A ready-to-use dashboard built entirely from entities and cards this integration
# provides. No HACS frontend add-ons required.
#
# Four views:
#   • My Menu    — browse & edit each week's meal selection (meal-planner card)
#   • Market     — browse & order HelloFresh Market add-ons (market card)
#   • Schedule   — delivery calendar, subscription summary, selection deadlines
#   • Diagnostics — token expiry & integration-health entities, manual refresh
#
# ── Setup ─────────────────────────────────────────────────────────────────────
# 1. Settings → Dashboards → ⋮ → "Edit in YAML" (or add a new YAML-mode dashboard),
#    then paste the contents of this file.
#
# 2. Fix the entity-ID prefix — THIS IS REQUIRED. With `has_entity_name`, entity IDs
#    derive from your config-entry title: a "HelloFresh (US)" account produces
#    `sensor.hellofresh_us_next_delivery_date`, etc. This file uses `hellofresh_us_`
#    throughout, so find/replace it with your account's prefix. (Check the real IDs at
#    Settings → Devices & Services → HelloFresh → entities.) Leaving the wrong prefix
#    makes the built-in cards show "Entity not available".
#
# ── Notes ─────────────────────────────────────────────────────────────────────
# • The custom cards — `custom:hellofresh-meal-planner-card`, `custom:hellofresh-market-card`,
#   and `custom:hellofresh-food-profile-card` — are served and registered automatically when the
#   integration loads (no manual resource step in storage-mode dashboards). For YAML-mode
#   dashboards, add `/hellofresh/<card>.js` once under Settings → Dashboards → Resources
#   as a JavaScript module. Every other view is 100% built-in Lovelace.
# • Some cards are conditional (holiday banner, shipment tracking) and render only when
#   relevant, so they stay hidden in the normal case.
################################################################################

title: HelloFresh
views:
  - title: My Menu
    path: meal-planner
    icon: mdi:silverware-variant
    panel: true
    cards:
      - type: custom:hellofresh-meal-planner-card
        title: My Menu
        logo: true
    type: panel
  - title: Market
    path: market
    icon: mdi:storefront
    panel: true
    cards:
      - type: custom:hellofresh-market-card
        title: Market
        logo: true
    type: panel
  - title: Food Profile
    path: food-profile
    icon: mdi:food-apple
    panel: true
    cards:
      - type: custom:hellofresh-food-profile-card
        title: Food Profile
        logo: true
    type: panel
  - title: Schedule
    path: planning
    icon: mdi:calendar-month
    cards:
      - show_name: true
        show_icon: true
        show_state: true
        type: glance
        title: Subscription
        entities:
          - entity: sensor.hellofresh_us_account_id
            name: Account ID
          - entity: sensor.hellofresh_us_subscription_status
            name: Subscription status
          - entity: sensor.hellofresh_us_selected_plan
            name: Plan
          - entity: sensor.hellofresh_us_account_credit
            name: Account credit
          - entity: sensor.hellofresh_us_boxes_received
            name: Boxes received
          - entity: sensor.hellofresh_us_number_of_people
            name: Servings
          - entity: sensor.hellofresh_us_required_meal_count
            name: Meals Required
          - entity: sensor.hellofresh_us_upcoming_delivery_count
            name: Upcoming
          - entity: sensor.hellofresh_us_skipped_week_count
            name: Skipped
          - entity: sensor.hellofresh_us_subscription_count
            name: Subscription count
          - entity: sensor.hellofresh_us_weeks_needing_selection
            name: Weeks need selecting
          - entity: sensor.hellofresh_us_next_skipped_week
            name: Next skipped
        columns: 3
      - type: glance
        title: Next box
        columns: 2
        state_color: true
        entities:
          - entity: sensor.hellofresh_us_next_delivery_date
            name: Delivery date
          - entity: sensor.hellofresh_us_next_delivery_week
            name: Delivery week
          - entity: sensor.hellofresh_us_next_selection_deadline
            name: Selection deadline
          - entity: sensor.hellofresh_us_next_order_status
            name: Status
          - entity: sensor.hellofresh_us_next_delivery_slot
            name: Delivery slot
          - entity: sensor.hellofresh_us_next_delivery_blocked
            name: Delivery blocked
          - entity: sensor.hellofresh_us_recent_order_id
            name: Order ID
          - entity: sensor.hellofresh_us_delivery_count_this_week
            name: Delivery count
          - entity: sensor.hellofresh_us_selected_meal_count
            name: Meal count
          - entity: sensor.hellofresh_us_selected_market_count
            name: Market count
          - entity: sensor.hellofresh_us_next_payment_date
            name: Payment date
          - entity: sensor.hellofresh_us_next_box_total_price
            name: Box total price
          - entity: sensor.hellofresh_us_next_box_coupon
            name: Coupon
          - entity: sensor.hellofresh_us_next_delivery_preselected
            name: Meals preselected
      - show_name: true
        show_icon: true
        show_state: true
        type: glance
        entities:
          - entity: sensor.hellofresh_us_next_selectable_delivery_date
            name: Delivery date
          - entity: sensor.hellofresh_us_next_selectable_delivery_week
            name: Delivery week
          - entity: sensor.hellofresh_us_next_selectable_delivery_meal_count
            name: Meal count
          - entity: sensor.hellofresh_us_next_selectable_delivery_market_count
            name: Market count
          - entity: sensor.hellofresh_us_next_selectable_delivery_selection_deadline
            name: Selection deadline
          - entity: sensor.hellofresh_us_selected_plan_total_price
            name: Plan total price
          - entity: sensor.hellofresh_us_next_selectable_delivery_preselected
            name: Meals preselected
        columns: 2
        title: Next selectable box
      - type: calendar
        title: Delivery schedule
        initial_view: dayGridMonth
        entities:
          - calendar.hellofresh_us_delivery_schedule
      - type: tile
        entity: sensor.hellofresh_us_delivery_address
        name: Delivery address
        vertical: false
        features_position: bottom
      - type: conditional
        conditions:
          - entity: sensor.hellofresh_us_next_holiday_message
            state_not: unknown
          - entity: sensor.hellofresh_us_next_holiday_message
            state_not: unavailable
        card:
          type: markdown
          content: >
            ### 🎄 Holiday delivery change

            {{ states('sensor.hellofresh_us_next_holiday_message') }}

            New date: **{{
            states('sensor.hellofresh_us_next_holiday_delivery_date') }}**
    type: masonry
  - title: Diagnostics
    path: diagnostics
    icon: mdi:stethoscope
    cards:
      - type: entities
        title: Token health
        show_header_toggle: false
        entities:
          - entity: sensor.hellofresh_us_access_token_minutes_remaining
            name: Access token expires in
          - entity: sensor.hellofresh_us_refresh_token_days_remaining
            name: Refresh token expires in
      - type: entities
        title: Actions
        show_header_toggle: false
        entities:
          - entity: button.hellofresh_us_refresh_data
            name: Refresh now
      - type: entities
        title: Integration health
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.hellofresh_us_next_delivery_subscription
            name: Delivery subscription ID
          - entity: sensor.hellofresh_us_api_base_url
            name: API base URL
          - entity: binary_sensor.hellofresh_us_payload_shape_changed
            name: Payload shape changed
          - entity: binary_sensor.hellofresh_us_write_actions_available
            name: Write actions available
    type: masonry