# HelloFresh — example Lovelace dashboard
#
# A ready-to-use dashboard built from the entities this integration exposes, in six views:
# Meal planner, Shipment Tracking, Meal Selection, Planning, Account, and Diagnostics.
#
# ── How to use ────────────────────────────────────────────────────────────────
# 1. Settings → Dashboards → ⋮ → "Edit in YAML" (or add a new dashboard in YAML
#    mode) and paste the contents of this file.
# 2. Fix the entity-ID prefix. With `has_entity_name`, entity IDs are derived
#    from your config-entry title, e.g. a "HelloFresh (US)" account produces
#    `sensor.hellofresh_us_next_delivery_date`. This file uses that `hellofresh_us_`
#    prefix throughout — find/replace it to match your account (check
#    Settings → Devices & Services → HelloFresh → entities for the real IDs).
# 3. Some cards are conditional (holiday banner, shipment tracking) and only render
#    when relevant, so they stay hidden in the normal case.
#
# ── Add-ons ─────────────────────────────────────────────────────────────────────
# The only custom card is the integration's own `custom:hellofresh-meal-planner-card`
# (on the Meal planner view), which the integration auto-registers — no HACS frontend
# add-on is required. Every other view is 100% built-in Lovelace.

title: HelloFresh
views:
  - title: My Menu
    path: meal-planner
    icon: mdi:silverware-variant
    panel: true
    cards:
      - type: custom:hellofresh-meal-planner-card
        title: My Menu
        logo: true
    type: panel
  - title: Meal Schedule
    path: planning
    icon: mdi:calendar-month
    cards:
      - type: glance
        title: Next box
        columns: 2
        state_color: true
        entities:
          - entity: sensor.hellofresh_us_next_delivery_date
            name: Delivery date
          - entity: sensor.hellofresh_us_next_order_status
            name: Status
          - entity: sensor.hellofresh_us_next_delivery_slot
            name: Delivery slot
          - entity: sensor.hellofresh_us_next_box_total_price
            name: Box total
      - type: conditional
        conditions:
          - entity: sensor.hellofresh_us_next_holiday_message
            state_not: unknown
          - entity: sensor.hellofresh_us_next_holiday_message
            state_not: unavailable
        card:
          type: markdown
          content: >
            ### 🎄 Holiday delivery change

            {{ states('sensor.hellofresh_us_next_holiday_message') }}

            New date: **{{
            states('sensor.hellofresh_us_next_holiday_delivery_date') }}**
      - type: conditional
        conditions:
          - entity: binary_sensor.hellofresh_us_tracked_shipment_available
            state: "on"
        card:
          type: entities
          title: Shipment tracking
          show_header_toggle: false
          state_color: true
          entities:
            - entity: sensor.hellofresh_us_shipment_tracking_status
              name: Status
            - entity: sensor.hellofresh_us_tracked_shipment_carrier
              name: Carrier
            - entity: sensor.hellofresh_us_shipment_tracking_number
              name: Tracking number
            - entity: sensor.hellofresh_us_next_delivery_tracking_url
              name: Tracking link
      - type: calendar
        title: Delivery schedule
        initial_view: dayGridMonth
        entities:
          - calendar.hellofresh_us_delivery_schedule
      - type: glance
        title: At a glance
        columns: 3
        entities:
          - entity: sensor.hellofresh_us_upcoming_delivery_count
            name: Upcoming
          - entity: sensor.hellofresh_us_delivery_count_this_week
            name: Next delivery count
          - entity: sensor.hellofresh_us_skipped_week_count
            name: Skipped
          - entity: sensor.hellofresh_us_next_skipped_week
            name: Next skipped
          - entity: sensor.hellofresh_us_boxes_received
            name: Boxes received
          - entity: sensor.hellofresh_us_public_menu_recipe_count
            name: Menu recipes
      - type: entities
        title: Dates
        show_header_toggle: false
        entities:
          - entity: sensor.hellofresh_us_next_delivery_date
            name: Next delivery date
          - entity: sensor.hellofresh_us_next_delivery_week
            name: Next delivery week
          - entity: sensor.hellofresh_us_next_selectable_delivery_date
            name: Next selectable delivery date
          - entity: sensor.hellofresh_us_next_selectable_delivery_week
            name: Next selectable delivery week
          - entity: sensor.hellofresh_us_last_delivery_date
            name: Last delivery
          - entity: sensor.hellofresh_us_next_delivery_blocked
            name: Next delivery blocked
          - entity: sensor.hellofresh_us_next_holiday_delivery_date
            name: Holiday delivery date
      - type: history-graph
        title: Deliveries over time
        hours_to_show: 2160
        entities:
          - entity: sensor.hellofresh_us_next_order_status
            name: Next delivery status
          - entity: sensor.hellofresh_us_shipment_tracking_status
            name: Tracked shipment status
  - title: Account
    path: account
    icon: mdi:account-cog
    cards:
      - type: gauge
        name: Meals chosen (next delivery)
        entity: sensor.hellofresh_us_selected_meal_count
        min: 0
        max: 6
        needle: true
        severity:
          green: 3
          yellow: 1
          red: 0
      - type: entities
        title: Meal selection
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.hellofresh_us_selected_meal_count
            name: Next delivery meals chosen
          - entity: sensor.hellofresh_us_required_meal_count
            name: Meals required
          - entity: sensor.hellofresh_us_next_selection_deadline
            name: Next delivery selection deadline
          - entity: sensor.hellofresh_us_next_selectable_delivery_meal_count
            name: Next selectable delivery meals chosen
          - entity: sensor.hellofresh_us_next_selectable_delivery_selection_deadline
            name: Next selectable delivery deadline
      - type: conditional
        conditions:
          - entity: binary_sensor.hellofresh_us_needs_meal_selection
            state: "on"
        card:
          type: markdown
          title: Weeks needing selection
          content: >
            {% set weeks =
            state_attr('sensor.hellofresh_us_next_selection_deadline', 'weeks')
            or [] %} {% if weeks | count == 0 %} All caught up — nothing to
            choose. {% else %} | Week | Chosen | Deadline | | --- | :---: | ---
            | {% for w in weeks -%} {% set sel = w.meals_selected if
            w.meals_selected is not none else 0 -%} {% set req =
            w.meals_required if w.meals_required is not none else '?' -%} {% set
            dl = w.selection_deadline -%} | {{ w.display_name or w.delivery_date
            or w.week_id }} | {{ sel }}/{{ req }} | {{ as_timestamp(dl, 0) |
            timestamp_custom('%a %b %-d, %-I:%M %p', true) if dl else '—' }} |
            {% endfor %} {% endif %}
      - type: entities
        title: Billing
        show_header_toggle: false
        entities:
          - entity: sensor.hellofresh_us_account_credit
            name: Account credit
          - entity: sensor.hellofresh_us_selected_plan_total_price
            name: Selected plan total price
          - entity: sensor.hellofresh_us_next_box_total_price
            name: Next delivery total price
          - entity: sensor.hellofresh_us_next_payment_date
            name: Next delivery payment date
          - entity: sensor.hellofresh_us_recent_payment_date
            name: Most recent payment
          - entity: sensor.hellofresh_us_next_box_coupon
            name: Next delivery coupon
          - entity: sensor.hellofresh_us_recent_order_id
            name: Next delivery order ID
      - type: entities
        title: Subscription
        show_header_toggle: false
        entities:
          - entity: sensor.hellofresh_us_account_id
            name: Account ID
          - entity: sensor.hellofresh_us_subscription_count
            name: Account subscription count
          - entity: sensor.hellofresh_us_delivery_address
            name: Delivery address
          - entity: sensor.hellofresh_us_selected_plan
            name: Plan
          - entity: sensor.hellofresh_us_number_of_people
            name: Servings
  - title: Diagnostics
    path: diagnostics
    icon: mdi:stethoscope
    cards:
      - type: entities
        title: Token health
        show_header_toggle: false
        entities:
          - entity: sensor.hellofresh_us_access_token_minutes_remaining
            name: Access token expires in
          - entity: sensor.hellofresh_us_refresh_token_days_remaining
            name: Refresh token expires in
      - type: entities
        title: Integration health
        show_header_toggle: false
        state_color: true
        entities:
          - entity: binary_sensor.hellofresh_us_write_actions_available
            name: Write actions available
          - entity: binary_sensor.hellofresh_us_payload_shape_changed
            name: Payload shape changed
          - entity: binary_sensor.hellofresh_us_tracked_shipment_available
            name: Tracked shipment
          - entity: sensor.hellofresh_us_api_base_url
            name: API base URL
      - type: entities
        title: Actions
        show_header_toggle: false
        entities:
          - entity: button.hellofresh_us_refresh_data
            name: Refresh now
