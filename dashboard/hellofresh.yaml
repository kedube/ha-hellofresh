################################################################################
# HelloFresh — example Lovelace dashboard
#
# A ready-to-use dashboard built entirely from entities and cards this integration
# provides. No HACS frontend add-ons required.
#
# Four views:
#   • My Menu    — browse & edit each week's meal selection (meal-planner card)
#   • Market     — browse & order HelloFresh Market add-ons (market card)
#   • Schedule   — delivery calendar, subscription summary, selection deadlines
#   • Diagnostics — token expiry & integration-health entities, manual refresh
#
# ── Setup ─────────────────────────────────────────────────────────────────────
# 1. Settings → Dashboards → ⋮ → "Edit in YAML" (or add a new YAML-mode dashboard),
#    then paste the contents of this file.
#
# 2. Fix the entity-ID prefix — THIS IS REQUIRED. With `has_entity_name`, entity IDs
#    derive from your config-entry title: a "HelloFresh (US)" account produces
#    `sensor.hellofresh_us_next_delivery_date`, etc. This file uses `hellofresh_us_`
#    throughout, so find/replace it with your account's prefix. (Check the real IDs at
#    Settings → Devices & Services → HelloFresh → entities.) Leaving the wrong prefix
#    makes the built-in cards show "Entity not available".
#
# ── Notes ─────────────────────────────────────────────────────────────────────
# • The custom cards — `custom:hellofresh-meal-planner-card`, `custom:hellofresh-market-card`,
#   `custom:hellofresh-food-profile-card`, `custom:hellofresh-schedule-card`, and
#   `custom:hellofresh-subscription-card` — are served and
#   registered automatically when the
#   integration loads (no manual resource step in storage-mode dashboards). For YAML-mode
#   dashboards, add `/hellofresh/<card>.js` once under Settings → Dashboards → Resources
#   as a JavaScript module. Every other view is 100% built-in Lovelace.
# • The shipment-tracking card is conditional and renders only while a box has live tracking;
#   the holiday-delivery notice is built into the subscription card the same way.
################################################################################

title: HelloFresh
views:
  - title: My Menu
    path: meal-planner
    icon: mdi:silverware-variant
    panel: true
    cards:
      - type: custom:hellofresh-meal-planner-card
        title: My Menu
        logo: true
    type: panel
  - title: Market
    path: market
    icon: mdi:storefront
    panel: true
    cards:
      - type: custom:hellofresh-market-card
        title: Market
        logo: true
    type: panel
  - title: Food Profile
    path: food-profile
    icon: mdi:food-apple
    panel: true
    cards:
      - type: custom:hellofresh-food-profile-card
        title: Food Profile
        logo: true
    type: panel
  - title: Schedule
    path: planning
    icon: mdi:calendar-month
    cards:
      - type: custom:hellofresh-schedule-card
        title: Schedule
        logo: true
      # Condensed account/subscription overview (plan, credit, upcoming counters, coupon,
      # payment date, preselected flag) with the holiday-delivery notice built in — replaces
      # the long "Subscription details" entities list and the separate holiday markdown card.
      # Reads hellofresh.get_account_summary, so no entity-ID prefix fix-up is needed here.
      - type: custom:hellofresh-subscription-card
        title: Subscription
        logo: true
      - type: entities
        show_header_toggle: false
        entities:
          - entity: switch.hellofresh_us_skip_next_modifiable_week
            name: Skip next selectable week
      # Appears only while the current box has live tracking data (shipped → delivered).
      - type: conditional
        conditions:
          - entity: binary_sensor.hellofresh_us_tracked_shipment_available
            state: "on"
        card:
          type: entities
          title: Shipment tracking
          show_header_toggle: false
          state_color: true
          entities:
            - entity: sensor.hellofresh_us_shipment_tracking_status
              name: Status
            - entity: sensor.hellofresh_us_tracked_shipment_carrier
              name: Carrier
            - entity: sensor.hellofresh_us_shipment_tracking_number
              name: Tracking number
            - entity: sensor.hellofresh_us_next_delivery_tracking_url
              name: Tracking link
    type: masonry
  - title: Diagnostics
    path: diagnostics
    icon: mdi:stethoscope
    cards:
      - type: entities
        title: Token health
        show_header_toggle: false
        entities:
          - entity: sensor.hellofresh_us_access_token_minutes_remaining
            name: Access token expires in
          - entity: sensor.hellofresh_us_refresh_token_days_remaining
            name: Refresh token expires in
      - type: entities
        title: Actions
        show_header_toggle: false
        entities:
          - entity: button.hellofresh_us_refresh_data
            name: Refresh now
      - type: entities
        title: Integration health
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.hellofresh_us_next_delivery_subscription
            name: Delivery subscription ID
          - entity: sensor.hellofresh_us_api_base_url
            name: API base URL
          - entity: binary_sensor.hellofresh_us_payload_shape_changed
            name: Payload shape changed
          - entity: binary_sensor.hellofresh_us_write_actions_available
            name: Write actions available
    type: masonry