################################################################################
# HelloFresh — example dashboard
#
# The whole HelloFresh experience in ONE full-width card: Overview (next box, tracking,
# pantry list, what's coming up, past deliveries), Menu and Market (one box, one Save),
# Recipes, and Account (plan & billing, food preferences, spending). No HACS frontend
# add-ons required.
#
# One view: the card itself, full width (`type: panel`). A box's delivery history — the
# carrier's scan timeline, delivery photo and what was in it — opens from its row under
# Recent deliveries, so no separate activity view is needed.
#
# You may not need this file at all: the integration already puts the same card in Home
# Assistant's sidebar as "HelloFresh" (the "Show HelloFresh in the sidebar" option). Use this
# dashboard if you'd rather have it as a dashboard of your own, or to build on.
#
# ── Setup ─────────────────────────────────────────────────────────────────────
# 1. Settings → Dashboards → Add dashboard → New dashboard from scratch, open it, then
#    ⋮ → Edit dashboard → ⋮ → Raw configuration editor, and paste this file.
#
# 2. The card needs no entity IDs — it finds this integration's pantry lists, plan
#    controls and status sensors by itself.
#
# ── Notes ─────────────────────────────────────────────────────────────────────
# • With more than one HelloFresh account, add `config_entry_id:` to the card.
# • `custom:hellofresh-card` is registered automatically in storage-mode dashboards. In a
#   YAML-mode dashboard, add `/hellofresh/hellofresh-card.js?v=<integration version>` once
#   under Settings → Dashboards → Resources as a JavaScript module (see docs/dashboard.md).
# • The delivery-events entity (event.<account>_delivery_events) still fires for
#   automations — "notify me when the box ships" — and a logbook card of it still works if
#   you want one.
# • The previous multi-view layout, one single-purpose card per view, is kept as
#   dashboard/hellofresh-classic.yaml.
################################################################################

title: HelloFresh
views:
  - title: HelloFresh
    path: hellofresh
    icon: mdi:silverware-fork-knife
    type: panel
    cards:
      - type: custom:hellofresh-card
        # views: [overview, menu, market, recipes, account]
        # default_view: overview
        # accent: brand     # or `theme` for your HA theme's primary colour
