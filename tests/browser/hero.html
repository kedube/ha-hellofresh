<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; }
  body {
    width: 1600px; height: 980px; overflow: hidden; position: relative;
    background:
      radial-gradient(1200px 700px at 12% 0%, #e8f5d0 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 100%, #d7eadf 0%, transparent 60%),
      #f3f6ef;
  }
  .desk {
    position: absolute; left: 56px; top: 56px; width: 1296px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 2px 6px rgba(20, 40, 20, 0.08), 0 30px 70px rgba(20, 40, 20, 0.22);
  }
  .desk img { display: block; width: 100%; }
  .phone {
    position: absolute; right: 64px; bottom: 40px; width: 330px; padding: 12px; border-radius: 52px;
    background: #111; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25), 0 40px 80px rgba(0, 0, 0, 0.35);
  }
  .phone img { display: block; width: 100%; border-radius: 40px; }
</style></head>
<body>
  <div class="desk"><img src="shots/hero-desktop.png"></div>
  <div class="phone"><img src="shots/hero-phone.png"></div>
</body></html>
