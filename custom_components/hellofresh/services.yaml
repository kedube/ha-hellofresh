refresh_data:
  name: Refresh data
  description: Refresh HelloFresh account data immediately.
  fields:
    config_entry_id:
      required: false
      selector:
        text:

get_weeks:
  name: Get weeks
  description: >-
    Return HelloFresh delivery weeks with full recipe and selection detail
    (recipes are not exposed as entity attributes). Read-only; returns a
    response. Optionally filter to a single week.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    week_id:
      required: false
      selector:
        text:

get_account_summary:
  name: Get account summary
  description: >-
    Return the account and subscription headline values (plan, credit, upcoming
    counts, coupon, payment date, holiday notice) in one call — the same values
    the corresponding sensors report. Read-only; returns a response.
  fields:
    config_entry_id:
      required: false
      selector:
        text:

get_food_profile:
  name: Get food profile
  description: >-
    Return the customer's food profile (the preferences HelloFresh uses to
    auto-preselect future meals) together with the full catalog of selectable
    options. Read-only; returns a response.
  fields:
    config_entry_id:
      required: false
      selector:
        text:

set_food_profile:
  name: Set food profile
  description: >-
    Update the customer's food profile. Provide any of taste, household, or
    goals; only the sections supplied are changed. Returns the saved profile.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    taste:
      required: false
      description: >-
        Taste section, e.g. exclusions, dietaryPreferences, nutritions,
        mealTypes (lists) and cuisines, flavors, dishTypes, primaryProteins
        (maps of slug to +100 liked / -100 disliked).
      selector:
        object:
    household:
      required: false
      description: "Household section, e.g. {adults: 2, children: 0}."
      selector:
        object:
    goals:
      required: false
      description: "Goals section, e.g. {goals: [save-time, try-new-recipes]}."
      selector:
        object:

select_meals:
  name: Select meals
  description: >-
    Submit meal selections for a delivery week. Optionally returns a response
    ({"downgraded": bool}); downgraded is true when HelloFresh accepted the
    write but silently shrank the box to fit (a seamless downgrade).
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    week_id:
      required: true
      selector:
        text:
    recipe_ids:
      required: true
      selector:
        object:
    quantities:
      required: false
      description: >-
        Optional map of recipe_id to serving count (positive integer). Recipes
        omitted from the map default to one serving. The week's required-meal
        minimum is checked against total servings.
      example: '{ "69a9b548e566b4ce79049c5b": 2 }'
      selector:
        object:

select_market_items:
  name: Select market items
  description: >-
    Set the HelloFresh Market add-on (extras) selection for a delivery week.
    Optionally returns a response ({"downgraded": bool}); downgraded is true
    when HelloFresh accepted the write but silently shrank the box to fit.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    week_id:
      required: true
      selector:
        text:
    quantities:
      required: true
      description: >-
        Map of market item id/sku/index to quantity (0 removes the item). Items
        omitted from the map are left unselected.
      example: '{ "6a043d4f11906cfcd0513cee": 2 }'
      selector:
        object:

skip_week:
  name: Skip week
  description: Skip a specific HelloFresh delivery week.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    week_id:
      required: true
      selector:
        text:

unskip_week:
  name: Unskip week
  description: Restore a previously skipped HelloFresh delivery week.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    week_id:
      required: true
      selector:
        text:

reschedule_week:
  name: Reschedule week
  description: >-
    Move a single HelloFresh delivery week to a different delivery option
    (slot/day). One-off change; does not affect the recurring schedule.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    week_id:
      required: true
      selector:
        text:
    delivery_option:
      required: true
      selector:
        text:

change_delivery_weekday:
  name: Change delivery weekday
  description: >-
    Change the recurring delivery option and interval for a subscription's plan.
    Affects all future deliveries.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    delivery_option:
      required: true
      selector:
        text:
    delivery_interval:
      required: false
      selector:
        number:
          min: 1
          max: 4
          mode: box
    subscription_id:
      required: false
      selector:
        text:

get_plan_options:
  name: Get plan options
  description: >-
    List the box sizes this subscription can switch to (meals per week x servings),
    with prices. Returns a response; the "handle" of any option is what change_plan
    accepts. Read-only.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    subscription_id:
      required: false
      selector:
        text:

change_plan:
  name: Change plan
  description: >-
    Change the recurring box size (meals per week x servings). This affects all future
    boxes and changes what you are billed. Use get_plan_options to list valid handles.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    product_handle:
      required: true
      example: US-CBU-3-2-0
      selector:
        text:
    subscription_id:
      required: false
      selector:
        text:

get_delivery_options:
  name: Get delivery options
  description: >-
    Return the plan's selectable delivery days (weekday, name, price, and which
    is the current default) — the full delivery-day picker the website uses.
    Read-only; returns a response.
  fields:
    config_entry_id:
      required: false
      selector:
        text:

get_delivery_tracking:
  name: Get delivery tracking
  description: >-
    Return the live last-mile tracking snapshot (phase, driver name and GPS
    position, stops before you, minute-precision ETA) from HelloFresh's own
    delivery-fleet tracker. Only available for accounts in countries where
    HelloFresh runs its own fleet (currently the Netherlands); elsewhere the
    response is {"available": false}. Read-only; returns a response.
  fields:
    config_entry_id:
      required: false
      selector:
        text:

get_plans:
  name: Get plans
  description: >-
    Return the account's plan catalog (product handle, price, status).
    Read-only; returns a response.
  fields:
    config_entry_id:
      required: false
      selector:
        text:

get_presets:
  name: Get presets
  description: >-
    Return the region's menu presets (Chef's Choice, Veggie, Quick & Easy, …)
    with their handle, name, and description. Read-only; returns a response.
  fields:
    config_entry_id:
      required: false
      selector:
        text:

get_spending:
  name: Get spending
  description: >-
    Return the customer's HelloFresh spending ledger from the full billing
    history: per-box weeks, a per-month rollup, and a running lifetime total
    of past deliveries. Read-only; returns a response. Powers the cost card.
  fields:
    config_entry_id:
      required: false
      selector:
        text:

get_favorites:
  name: Get favorites
  description: >-
    Return your HelloFresh cookbook. With no arguments, lists every bookmark
    with full detail (title, image, times, nutrition) — including ones the
    HelloFresh website hides, since its cookbook page only shows a 3-item
    preview. Pass recipe_ids instead to ask the cheaper filter endpoint which
    of THOSE are bookmarked (ids only). Read-only; returns a response.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    recipe_ids:
      required: false
      example: '["694053fe353e00bd89ba2d3e"]'
      selector:
        object:

add_favorite:
  name: Add favorite
  description: >-
    Bookmark a recipe in the HelloFresh cookbook.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    recipe_id:
      required: true
      example: 694053fe353e00bd89ba2d3e
      selector:
        text:

remove_favorite:
  name: Remove favorite
  description: >-
    Remove a recipe bookmark from the HelloFresh cookbook.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    recipe_id:
      required: true
      example: 694053fe353e00bd89ba2d3e
      selector:
        text:

get_recipe_collections:
  name: Get recipe collections
  description: >-
    Return the browsable categories of the public HelloFresh recipe catalog
    (Chicken Recipes, Carb Smart, Hall of Fame, …). Read-only; returns a
    response. Use a returned slug with Get catalog recipes.
  fields:
    config_entry_id:
      required: false
      selector:
        text:

get_catalog_recipes:
  name: Get catalog recipes
  description: >-
    Return recipes from the public HelloFresh recipe catalog, optionally within
    one collection. This is browse content for all customers, independent of
    your subscription and delivery weeks. Read-only; returns a response.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    collection:
      required: false
      example: chicken-recipes
      selector:
        text:
    search:
      required: false
      example: paneer tikka
      selector:
        text:
    limit:
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 200
          mode: box

preview_meal_price:
  name: Preview meal price
  description: >-
    Price a hypothetical meal selection for a week without saving it — the
    grand total, subtotal, shipping, tax, and any per-meal premium surcharges.
    Read-only: nothing is written to your account. Only works for weeks that
    are still bookable.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    week_id:
      required: true
      example: 2026-W39
      selector:
        text:
    recipe_ids:
      required: true
      example: '["69e91aa2fe534c766c45a33a"]'
      selector:
        object:
    quantities:
      required: false
      example: '{"69e91aa2fe534c766c45a33a": 2}'
      selector:
        object:

get_recipe_detail:
  name: Get recipe detail
  description: >-
    Return one recipe's full cooking detail — ingredients (scaled to a serving
    count), step-by-step instructions, utensils, allergens, nutrition, and a
    link to the printable recipe card. Works for any recipe id, whether it came
    from a delivery week or the browse catalog. Read-only; returns a response.
  fields:
    config_entry_id:
      required: false
      selector:
        text:
    recipe_id:
      required: true
      example: 6819dfd55efe69a088447ef3
      selector:
        text:
    servings:
      required: false
      example: 4
      selector:
        number:
          min: 1
          max: 12
          mode: box
