[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "UP017",   # datetime.UTC alias — codebase consistently uses timezone.utc
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.hellofresh"]

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
source = ["custom_components/hellofresh"]

[tool.coverage.report]
# A floor a little under what the suite reaches, so a change that leaves a path untested
# fails CI. Raise it as coverage grows; do not lower it to get a change through.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
# The integration's own code, checked as CI does: `python -m mypy`. Home Assistant and the
# other libraries it imports ship their own type information, so no import is ignored.
python_version = "3.14"
files = ["custom_components/hellofresh"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
