name: Bug report
description: Report a problem with the HelloFresh integration.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for us to reproduce the issue.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.6.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: "0.01"
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual copy
        - Other
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: HelloFresh region
      options:
        - United States
        - United Kingdom
        - Canada
        - Australia
        - Germany
        - Netherlands
        - Other
    validations:
      required: true
  - type: dropdown
    id: auth_method
    attributes:
      label: Authentication method
      options:
        - Email and password
        - Access token
        - Not sure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Tell us what you expected and what actually happened.
      placeholder: A short summary of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste relevant Home Assistant logs or diagnostics with secrets removed.
      render: shell
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics export
      description: If this involves parsing, menus, delivery data, or account state, attach a Home Assistant diagnostics export after reviewing it for private data.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that may help debug the issue.
