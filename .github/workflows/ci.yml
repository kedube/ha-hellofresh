name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: HACS validation
        # Pinned by SHA (main @ 2026-06-08). HACS stopped cutting release tags after the
        # 22.5.0 CalVer tag in 2022, so main is the only current reference -- do NOT "upgrade"
        # to 22.5.0, which is four years older than this pin.
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run hassfest
        # Pinned by SHA (master @ 2026-08-03). This repo is untagged, so Dependabot tracks
        # the branch head.
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3

  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run Ruff lint
        run: python -m ruff check .

      # Enabled once the repo was formatted in full, so this starts from a clean tree and only
      # ever fails on newly-introduced drift.
      - name: Check Ruff formatting
        run: python -m ruff format --check .

  cards:
    name: Cards
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The Lovelace cards are ~8k lines of hand-written JS that no other job looks at, so a
      # typo used to reach users as a blank dashboard panel. This proves each card parses.
      - name: Syntax-check Lovelace cards
        run: python .github/scripts/check_card_syntax.py

      # Week-selection logic is where every past-week browsing regression has landed. These
      # run the cards' real `_browsableWeeks` and require the Market and My Menu cards to
      # expose the same past weeks.
      - name: Test card week-selection logic
        run: node .github/scripts/check_card_logic.mjs

      # The card's English text ships twice: in strings.json (the source Home Assistant serves)
      # and as www/hellofresh-i18n-en.js, generated from it. This fails when they drift.
      - name: Check the card's English text module
        run: python .github/scripts/generate_card_strings.py --check

  browser:
    name: Browser flows
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install test dependencies
        working-directory: tests/browser
        run: npm ci

      # The HelloFresh card in headless Chrome (the runner's own) against a fake Home Assistant
      # with made-up data, through its real flows: building and saving a box, customizing a
      # dish, filters, the calendar, delivery details, live tracking and the sidebar panel.
      # The fixtures' dates are local, so the zone is pinned to the one they were written in.
      - name: Run browser flows
        working-directory: tests/browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
          TZ: America/New_York
        run: npm test

  pytest:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run tests
        run: python -m pytest -q
