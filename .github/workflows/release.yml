name: Release

# Releases go out only when someone runs this workflow: Actions → Release → Run workflow, or
# `gh workflow run release.yml`. A push to main runs CI and nothing else.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none = re-release current manifest version)"
        required: true
        default: "minor"
        type: choice
        options:
          - minor
          - major
          - none

permissions:
  contents: write
  # Reads CI's runs, to release only a commit CI passed.
  actions: read

concurrency:
  group: release-main
  # A second run waits for the first instead of cancelling it partway through a release.
  cancel-in-progress: false

jobs:
  release:
    name: Bump manifest and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      # Only a commit CI passed is released. A release commit skips CI and changes nothing but
      # the version and the changelog, so for one of those the commit before it must have passed.
      - name: Check main is ready to release
        id: head_check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          tested_sha="$current_sha"
          latest_subject="$(git log -1 --format=%s "$current_sha")"
          if [[ "$latest_subject" == chore\(release\):*\ \[skip\ ci\] ]]; then
            if [ "$BUMP_INPUT" != "none" ]; then
              echo "::error::Nothing to release: main hasn't changed since \"$latest_subject\"."
              exit 1
            fi
            tested_sha="$(git rev-parse "$current_sha^")"
          fi

          passed="$(gh run list --workflow ci.yml --commit "$tested_sha" --status success --json databaseId --jq length)"
          if [ "$passed" = "0" ]; then
            echo "::error::CI hasn't passed on $tested_sha. Run the release again once it has."
            exit 1
          fi

          if [ "$BUMP_INPUT" = "none" ]; then
            echo "release_action=existing" >> "$GITHUB_OUTPUT"
          else
            echo "release_action=bump" >> "$GITHUB_OUTPUT"
          fi
          echo "release_target=$current_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Bump manifest version and rotate changelog
        if: steps.head_check.outputs.release_action == 'bump'
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump }}
        run: |
          new_version="$(python .github/scripts/bump_manifest_version.py --bump "$BUMP_TYPE")"
          python .github/scripts/update_changelog.py "$new_version"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Read existing manifest version
        if: steps.head_check.outputs.release_action == 'existing'
        id: current_version
        run: |
          new_version="$(python -c 'import json; print(json.load(open("custom_components/hellofresh/manifest.json"))["version"])')"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit release version
        if: steps.head_check.outputs.release_action == 'bump'
        id: commit_release
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/hellofresh/manifest.json CHANGELOG.md
          git commit -m "chore(release): $NEW_VERSION [skip ci]"
          echo "release_target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push release commit
        if: steps.head_check.outputs.release_action == 'bump'
        run: git push origin HEAD:main

      # GitHub's auto-generated notes only list merged PRs, so direct-to-main releases came
      # out empty. Build the body ourselves: Highlights from CHANGELOG.md (rotated from its
      # Unreleased section during the bump) plus the commit list since the previous tag.
      - name: Generate release notes
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version || steps.current_version.outputs.new_version }}
        run: python .github/scripts/generate_release_notes.py "$NEW_VERSION" release_notes.md

      - name: Create GitHub release
        uses: actions/github-script@v9
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version || steps.current_version.outputs.new_version }}
          RELEASE_TARGET: ${{ steps.commit_release.outputs.release_target || steps.head_check.outputs.release_target }}
        with:
          script: |
            const fs = require('fs')
            const tag = process.env.NEW_VERSION
            const target = process.env.RELEASE_TARGET
            const body = fs.readFileSync('release_notes.md', 'utf8')
            const { owner, repo } = context.repo

            try {
              await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              })
              core.info(`Release ${tag} already exists; skipping creation.`)
              return
            } catch (error) {
              if (error.status !== 404) {
                throw error
              }
            }

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: target,
              name: tag,
              body,
            })
